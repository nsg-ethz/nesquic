[package]
name = "nesquic"
version = "0.1.0"
edition = "2021"

[lib]
name = "nesquic"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
redhook = "2.0.0"
libc = "0.2.189"
bytes = "1"
quinn-proto = { version = "0.11.16", default-features = false }
qlog = "0.15.2"
ureq = { version = "3", default-features = false }
s2n-quic-core = { version = "0.91.0", default-features = false }
s2n-codec = { version = "0.91.0", default-features = false }
serde = "1"
serde_json = "1"
